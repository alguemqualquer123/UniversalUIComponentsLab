name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux
          - os: macos-latest
            name: macOS

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies (OpenGL + X11 headers for GLFW)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev

      - name: Configure
        run: cmake -S . -B build ${{ matrix.os == 'ubuntu-latest' && '-DGLFW_BUILD_WAYLAND=OFF' || '' }}

      - name: Build
        run: cmake --build build --config Release

      - name: Run self-test (Windows)
        if: matrix.os == 'windows-latest'
        run: build\bin\Release\UniversalUIComponentsLab.exe --self-test

      - name: Run self-test (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          EXE=$(find build -maxdepth 2 -name UniversalUIComponentsLab -type f -perm -u+x | head -1)
          test -n "$EXE"
          "$EXE" --self-test
